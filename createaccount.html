<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadoo — Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="createaccount.css" />
    <link rel="stylesheet" href="offer.css" />
    <link rel="stylesheet" href="destination.css" />
    <link rel="stylesheet" href="trip.css" />
    <link rel="stylesheet" href="testimonial.css" />
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="subscription.css" />
    <link rel="stylesheet" href="footer.css" />
    <link rel="icon" href="images/Logo.svg" size="32x32 16x16" />

    <title>Create Account</title>
  </head>

  <body>
    <div class="auth-wrapper">
      <!-- Left Panel: Brand / Visual -->
      <div class="auth-panel auth-panel--left">
        <div class="auth-brand">
          <img
            src="images/Logo.svg"
            alt="Jadoo Logo"
            class="auth-logo"
            loading="lazy"
            encoding="async"
          />
        </div>
        <div class="auth-visual">
          <div class="visual-blob"></div>
          <div class="visual-circle vc1"></div>
          <div class="visual-circle vc2"></div>
          <div class="visual-circle vc3"></div>
          <div class="visual-text">
            <h2>Start your journey <span>today.</span></h2>
            <p>Join thousands of travelers exploring the world with Jadoo.</p>
          </div>
          <div class="plane-anim">
            <img src="images/plane.svg" alt="" class="anim-plane" />
          </div>
          <div class="stat-card sc1">
            <span class="stat-num">120+</span>
            <span class="stat-label">Countries</span>
          </div>
          <div class="stat-card sc2">
            <span class="stat-num">50k+</span>
            <span class="stat-label">Happy Travelers</span>
          </div>
        </div>
      </div>

      <!-- Right Panel: Form -->
      <div class="auth-panel auth-panel--right">
        <div class="form-container">
          <div class="form-header">
            <h1>Create Account</h1>
            <p>
              Already have an account?
              <a href="login.html" class="switch-link">Log in</a>
            </p>
          </div>

          <form class="auth-form" id="createAccountForm" novalidate>
            <!-- Full Name -->
            <div class="field-group">
              <label for="fullname">Full Name</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </span>
                <input
                  type="text"
                  id="fullname"
                  name="fullname"
                  placeholder="Enter Full Name"
                  autocomplete="name"
                  required
                />
              </div>
              <span class="field-error" id="fullname-error"></span>
            </div>

            <!-- Email -->
            <div class="field-group">
              <label for="email">Email Address</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <polyline points="2,4 12,13 22,4" />
                  </svg>
                </span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="username@gmail.com"
                  autocomplete="email"
                  required
                />
              </div>
              <span class="field-error" id="email-error"></span>
            </div>

            <!-- Password -->
            <div class="field-group">
              <label for="password">Password</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Minimum. 8 characters"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  class="toggle-pw"
                  aria-label="Toggle password visibility"
                  data-target="password"
                >
                  <svg
                    class="eye-open"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="eye-closed"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="display: none"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <div class="pw-strength" id="pw-strength">
                <div class="pw-bar"><span id="pw-fill"></span></div>
                <span id="pw-label"></span>
              </div>
              <span class="field-error" id="password-error"></span>
            </div>

            <!-- Confirm Password section -->

            <div class="field-group">
              <label for="confirm-password">Confirm Password</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                </span>
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  placeholder="Confirm  your password"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  class="toggle-pw"
                  aria-label="Toggle confirm password visibility"
                  data-target="confirm-password"
                >
                  <svg
                    class="eye-open"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="eye-closed"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="display: none"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="confirm-password-error"></span>
            </div>

            <!-- Terms -->
            <div class="field-group field-group--checkbox">
              <label class="checkbox-label">
                <input type="checkbox" id="terms" name="terms" required />
                <span class="checkmark"></span>
                I agree to the
                <a href="#" class="switch-link">Terms of Service</a> and
                <a href="#" class="switch-link">Privacy Policy</a>
              </label>
              <span class="field-error" id="terms-error"></span>
            </div>

            <!-- Submit button part -->
            <button type="submit" class="submit-btn" id="submit-btn">
              <a href="login.html"
                ><span class="btn-text">Create Account</span>
                <span class="btn-loader" style="display: none">
                  <span class="dot"></span><span class="dot"></span
                  ><span class="dot"></span> </span
              ></a>
            </button>
          </form>

          <!-- Divider part -->
          <div class="auth-divider"><span>or sign up with</span></div>

          <!-- Social media  Buttons -->
          <div class="social-btns">
            <button class="social-btn" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"
                />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05"
                />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"
                />
              </svg>
              Google
            </button>
            <button class="social-btn" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                />
              </svg>
              Facebook
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="createaccount.js"></script>
  </body>
</html>
